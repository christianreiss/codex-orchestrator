<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter-variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Codex Orchestrator</title>
    <script>
      // Apply persisted theme synchronously to avoid FOUC.
      try {
        const legacy = localStorage.getItem("codex.theme.palette");
        const raw = localStorage.getItem("codex.theme") || legacy || "system";
        const stored = raw === "auto" || raw === "auto-pink" ? "system" : raw === "bright-pink" ? "light" : raw === "dark-pink" ? "dark" : raw;
        const isDark =
          stored === "dark" ||
          (stored === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
        if (raw !== stored || legacy) {
          localStorage.setItem("codex.theme", stored);
          localStorage.removeItem("codex.theme.palette");
        }
      } catch (_e) {}
    </script>
    %sveltekit.head%
  </head>
  <body class="h-full bg-background text-foreground antialiased" data-sveltekit-preload-data="hover">
    <div id="app" class="h-full">%sveltekit.body%</div>
  </body>
</html>
