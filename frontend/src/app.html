<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <title>Codex Orchestrator</title>
    <script>
      // Apply persisted theme synchronously to avoid FOUC.
      try {
        const stored = localStorage.getItem("codex.theme") || "system";
        const isDark =
          stored === "dark" ||
          (stored === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      } catch (_e) {}
    </script>
    %sveltekit.head%
  </head>
  <body class="h-full bg-background text-foreground antialiased" data-sveltekit-preload-data="hover">
    <div id="app" class="h-full">%sveltekit.body%</div>
  </body>
</html>
