<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchestrator &mdash; Login</title>
  <link rel="prefetch" href="/admin/index.html" as="document" data-admin-prefetch>
  <link rel="prefetch" href="/admin/assets/dashboard.css?v=2026-04-29-01" as="style" data-admin-prefetch>
  <link rel="prefetch" href="/admin/assets/dashboard-mobile.css?v=2026-04-29-01" as="style" data-admin-prefetch>
  <link rel="prefetch" href="/admin/assets/dashboard.js?v=2026-05-11-02" as="script" data-admin-prefetch>
  <link rel="stylesheet" href="/admin/assets/theme.css?v=2026-04-29-01">
  <link rel="stylesheet" href="/admin/assets/login.css?v=2026-05-05-01">
</head>
<body data-theme="auto">
  <main class="login-shell" aria-labelledby="loginTitle">
    <div class="login-card">
      <div class="brand-mark" aria-label="OpenAI and Claude">
        <img class="brand-logo brand-logo-openai" src="/admin/assets/openai-logo.svg" alt="OpenAI">
        <img class="brand-logo brand-logo-claude" src="/admin/assets/claude-logo.svg" alt="Claude">
      </div>

      <h1 id="loginTitle" class="login-title">Orchestrator</h1>
      <p class="login-copy" id="adminLoginCopy">Enter your username to continue.</p>

      <form id="adminLoginForm" class="login-form" novalidate>
        <label class="field" for="adminLoginUsername">
          <span>Username</span>
          <input type="text" id="adminLoginUsername" autocomplete="username" required placeholder="admin">
        </label>

        <label class="field" for="adminLoginPassword" id="adminLoginPasswordField" hidden>
          <span>Password</span>
          <input type="password" id="adminLoginPassword" autocomplete="current-password">
        </label>

        <div class="login-error" id="adminLoginError" role="alert"></div>
        <button type="submit" class="login-submit" id="adminLoginSubmit">
          <span class="btn-label">Login</span>
          <kbd class="kbd-hint" aria-hidden="true">Enter &#x21B5;</kbd>
        </button>
      </form>
    </div>
  </main>
  <script src="/admin/assets/login.js?v=2026-03-30-02"></script>
</body>
</html>
