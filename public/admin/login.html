<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Orchestrator &mdash; Login</title>
  <link rel="stylesheet" href="/admin/assets/login.css?v=2026-03-17-01">
</head>
<body data-theme="auto">
  <main class="login-shell" aria-labelledby="loginTitle">
    <div class="login-card">
      <div class="brand-mark">
        <img class="brand-logo" src="/admin/assets/openai-logo.svg" alt="OpenAI logo">
      </div>

      <h1 id="loginTitle" class="login-title">Codex Orchestrator</h1>

      <form id="adminLoginForm" class="login-form" novalidate>
        <label class="field" for="adminLoginUsername">
          <span>Username</span>
          <input type="text" id="adminLoginUsername" autocomplete="username" required placeholder="admin">
        </label>

        <label class="field" for="adminLoginPassword">
          <span>Password</span>
          <input type="password" id="adminLoginPassword" autocomplete="current-password" required>
        </label>

        <div class="login-error" id="adminLoginError" role="alert"></div>
        <button type="submit" class="login-submit" id="adminLoginSubmit">
          <span class="btn-label">Sign in</span>
          <kbd class="kbd-hint" aria-hidden="true">Enter &#x21B5;</kbd>
        </button>
      </form>

      <div class="passkey-divider" id="passkeyDivider" style="display:none;"><span>or</span></div>
      <button type="button" class="passkey-login-btn" id="passkeyLoginBtn" style="display:none;">Sign in with passkey</button>
    </div>
  </main>
  <script src="/admin/assets/login.js?v=2026-03-17-01"></script>
  <script src="/admin/assets/passkey-login.js?v=2026-03-17-01"></script>
</body>
</html>
