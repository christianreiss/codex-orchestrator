name: wrappers
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'wrappers/**'
      - '.github/workflows/wrappers.yml'
  pull_request:
    paths:
      - 'wrappers/**'
      - '.github/workflows/wrappers.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test cxx
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: 'wrappers/cxx/go.sum'
      - name: gofmt
        working-directory: wrappers/cxx
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        working-directory: wrappers/cxx
        run: go vet ./...
      - name: wrapper and release-metadata tests
        working-directory: wrappers
        run: make test
      # The wrapper spawns peers, watches auth files, and runs a cron loop, so
      # its concurrency is not incidental. `make test` runs without -race.
      - name: race detector
        working-directory: wrappers/cxx
        run: go test -race ./...
      # Waivers live in wrappers/cxx/staticcheck.conf with their reasons.
      - name: staticcheck
        working-directory: wrappers/cxx
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck
        working-directory: wrappers/cxx
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      # The OpenTelemetry SDK is behind the cxx_otel build tag, so the tracing
      # egress guard and span-hygiene tests do not build in the step above. The
      # build and release jobs stay untagged on purpose: the fleet artifact must
      # not carry the SDK.
      - name: traced-mode vet and tests
        working-directory: wrappers
        run: make test-traced

  build:
    name: build cxx ${{ matrix.os }}/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.13'
      - name: cross-compile
        working-directory: wrappers/cxx
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ../bin
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${GITHUB_SHA::7} -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "../bin/cxx-${{ matrix.os }}-${{ matrix.arch }}" ./cmd/cxx
          (cd ../bin && sha256sum "cxx-${{ matrix.os }}-${{ matrix.arch }}" > "cxx-${{ matrix.os }}-${{ matrix.arch }}.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cxx-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            wrappers/bin/cxx-${{ matrix.os }}-${{ matrix.arch }}
            wrappers/bin/cxx-${{ matrix.os }}-${{ matrix.arch }}.sha256
          retention-days: 14

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: stage layout
        run: |
          set -eu
          v=${GITHUB_REF_NAME#v}
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            src="artifacts/cxx-$platform"
            test -f "$src"
            os=${platform%-*}
            arch=${platform##*-}
            platform_dir="staged/cxx/$platform"
            dst="$platform_dir/v$v"
            mkdir -p "$dst"
            cp "$src" "$dst/cxx"
            chmod 755 "$dst/cxx"
            sha=$(sha256sum "$dst/cxx" | awk '{print $1}')
            declared=$(awk '{print $1}' "artifacts/cxx-$platform.sha256")
            test "$sha" = "$declared"
            size=$(wc -c < "$dst/cxx" | tr -d ' ')
            printf '%s  cxx\n' "$sha" > "$dst/cxx.sha256"
            printf '{\n  "engine": "cxx",\n  "os": "%s",\n  "arch": "%s",\n  "current": "%s",\n  "builds": [\n    {\n      "version": "%s",\n      "sha256": "%s",\n      "size_bytes": %s,\n      "signature": null,\n      "published_at": "%s"\n    }\n  ]\n}\n' \
              "$os" "$arch" "$v" "$v" "$sha" "$size" "$published_at" \
              > "$platform_dir/manifest.json"
          done
          printf '%s\n' \
            'This archive is a single-version release fragment.' \
            'Extract it to a stage root, then run wrappers make publish-release with OUTROOT set to that root.' \
            'Do not replace a live bin/cxx root with this fragment or older rollback builds will be lost.' \
            > staged/cxx/RELEASE-FRAGMENT.txt
          tar -C staged -czf "cxx-${GITHUB_REF_NAME}-bakery.tar.gz" cxx
          sha256sum "cxx-${GITHUB_REF_NAME}-bakery.tar.gz" \
            > "cxx-${GITHUB_REF_NAME}-bakery.tar.gz.sha256"
          test "$(find staged/cxx -type f -name cxx | wc -l)" -eq 4
          test "$(find staged/cxx -type f -name manifest.json | wc -l)" -eq 4
          find staged -type f -print | sort
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            cxx-*-bakery.tar.gz
            cxx-*-bakery.tar.gz.sha256
            artifacts/cxx-*
