name: android
on:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Lint, unit tests, and APK
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orchestrator-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
