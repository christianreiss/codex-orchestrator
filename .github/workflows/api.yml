name: api

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'bin/**'
      # The api suite is not confined to api/: its doc-truth, contract and
      # liveness scans open docs/, the Go wrappers, the frontend sources, the
      # manual articles under public/, runner/app.py, scripts/deploy.sh, the
      # Caddy configs and the compose file. Without these, a commit touching
      # only one of them runs no api job and the drift those tests exist to
      # catch ships. `api/test/unit/ops/ci-workflow-path-coverage.test.ts`
      # holds both filters below against what the tests actually read.
      - 'caddy/**'
      - 'docker-compose.yml'
      - 'docs/**'
      - 'frontend/**'
      - 'public/**'
      - 'runner/**'
      - 'scripts/**'
      - 'wrappers/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'bin/**'
      # Same trees as `push`; GitHub Actions has no YAML anchors, so the list
      # is spelled twice and the test above requires both copies to carry it.
      - 'caddy/**'
      - 'docker-compose.yml'
      - 'docs/**'
      - 'frontend/**'
      - 'public/**'
      - 'runner/**'
      - 'scripts/**'
      - 'wrappers/**'
      - '.github/workflows/api.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build

  # The real-MySQL tier. `ci` above runs without a database, so every suite that
  # needs one skips there — which is where migration idempotency, FULLTEXT
  # ranking, unique indexes and FK cascade live. `test:db:setup` turns the empty
  # service database into the "push-built" schema the migrations expect to
  # evolve; without it there is nothing for them to run against.
  db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: codex
          MYSQL_DATABASE: codex_test
          MYSQL_USER: codex
          MYSQL_PASSWORD: codex
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcodex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: codex_test
      DB_USERNAME: codex
      DB_PASSWORD: codex
      # Throwaway all-zero key: `loadEnv()` requires one, and nothing in this
      # job decrypts anything that outlives the runner.
      ENCRYPTION_ACTIVE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:db:setup
      - run: npm run migrate
      - run: npm run test:db
