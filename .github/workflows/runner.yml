name: runner

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      # The runner suite is not confined to runner/: both doc-surface tests
      # open docs/auth-runner.md and assert it names exactly the routes the
      # router registers. Without this, a commit editing only that document
      # runs no runner job and the drift those tests exist to catch ships.
      # `runner/test_ci_workflow_paths.py` holds both filters below against
      # the paths the tests actually read.
      - 'docs/auth-runner.md'
      - '.github/workflows/runner.yml'
  pull_request:
    paths:
      - 'runner/**'
      # Same paths as `push`; GitHub Actions has no YAML anchors, so the list
      # is spelled twice and the test above requires both copies to carry it.
      - 'docs/auth-runner.md'
      - '.github/workflows/runner.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Keep in step with the runner image (runner/Dockerfile).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest
