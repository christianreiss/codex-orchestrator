name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      # Brand regression tests compare the source SVG against the committed
      # static admin artifact, so an asset-only change must run this suite too.
      - 'public/admin/**'
      # The frontend suite is not confined to frontend/: `cli-auth.test.ts`
      # reads api/src/services/cli-auth.ts to pin the device-code alphabet
      # against the service that issues it. Without this, a commit touching
      # only the api runs no frontend job and the parity that test exists to
      # catch ships. `frontend/src/lib/ci-workflow-paths.test.ts` holds both
      # filters below against what the tests actually read.
      - 'api/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      # Keep generated/preserved admin brand assets under the same parity gate.
      - 'public/admin/**'
      # Same trees as `push`; GitHub Actions has no YAML anchors, so the list
      # is spelled twice and the test above requires both copies to carry it.
      - 'api/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test
      - run: npm run build
      # The portal is a second Vite build served at /go by the API; `npm run
      # build` does not produce it, so nothing was compiling it in CI.
      - run: npm run build:portal
      # The committed `public/admin` artifact is what the API serves. A build
      # whose output differs from what is checked in means the console on disk
      # is not the console in this commit.
      - name: committed admin artifact matches a fresh build
        working-directory: .
        run: |
          if ! git diff --quiet -- public/admin; then
            echo "public/admin is stale; run 'npm run build' in frontend/ and commit the result" >&2
            git --no-pager diff --stat -- public/admin >&2
            exit 1
          fi
      # The browser suite existed but no workflow ran it, so it rotted: an
      # assertion written against the older flat sidebar had been failing
      # unnoticed. Browsers are installed explicitly because the runner image
      # ships none.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
