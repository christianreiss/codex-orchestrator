name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      # The frontend suite is not confined to frontend/: `cli-auth.test.ts`
      # reads api/src/services/cli-auth.ts to pin the device-code alphabet
      # against the service that issues it. Without this, a commit touching
      # only the api runs no frontend job and the parity that test exists to
      # catch ships. `frontend/src/lib/ci-workflow-paths.test.ts` holds both
      # filters below against what the tests actually read.
      - 'api/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      # Same trees as `push`; GitHub Actions has no YAML anchors, so the list
      # is spelled twice and the test above requires both copies to carry it.
      - 'api/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test
      - run: npm run build
