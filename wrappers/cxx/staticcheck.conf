# staticcheck runs as a required CI gate. Everything it reports is fixed rather
# than suppressed, with two named exceptions — recorded here so the waiver is
# reviewable instead of silent.
#
# ST1005 "error strings should not be capitalized"
#   These strings are not internal diagnostics. `cxx` prints them straight to an
#   operator's terminal ("Codex CLI is not installed", "Fleet policy rejected
#   this host"), and several are matched verbatim by the orchestrator's own
#   tests and by operator runbooks. Lowercasing 20 user-visible messages is a
#   product decision about how the wrapper speaks, not a lint fix, and it
#   belongs to whoever owns that voice.
#
# ST1008 "error should be returned as the last return argument"
#   Four signatures in the auth-session internals return `(err, state)` because
#   the state is only meaningful when the error is non-nil. Reordering them is a
#   mechanical churn through call sites that carries a real chance of swapping
#   two values at a call boundary, for no defect.
#
# Anything else staticcheck finds is a bug to fix. SA4004 (a `for` loop whose
# every branch returned) and thirteen U1000 dead declarations were cleared when
# this gate was turned on.
# "inherit" is staticcheck's default check set; enabling "all" additionally
# turns on ST1000 (package comments), which is a documentation project of its
# own across ~40 packages and unrelated to correctness.
checks = ["inherit", "-ST1005", "-ST1008"]
